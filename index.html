<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIMS MI Najmul Khoir</title>

<style>
body{
font-family:Arial;
padding:30px;
background:#f1f5f9;
}

button{
padding:12px 20px;
background:#059669;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px #ccc;
}
</style>

</head>

<body>

<div class="card">

<h2>SIMS MI Najmul Khoir</h2>

<p>Uji koneksi Google Sheet</p>

<button onclick="kirimAbsensi()">
Kirim Absensi
</button>

<p id="hasil"></p>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxY746xdZrlP9F2NAs4aZfaRGgyvs3Buw1x3JzruYMmc9kzmoGpIvp0_yg9pOPuRUxRnw/exec";


function kirimAbsensi(){

const data = {

tanggal:"2026-07-31",
kelas:"1a",
id:"1a-1",
nisn:"00101",
nama:"Ahmad Fauzi",
status:"Hadir",
keterangan:"Uji coba"

};


fetch(API_URL,{
method:"POST",
body:JSON.stringify(data)
})

.then(res=>res.json())

.then(result=>{

document.getElementById("hasil").innerHTML =
"Berhasil terkirim ke Google Sheet";

})

.catch(error=>{

document.getElementById("hasil").innerHTML =
"Gagal: "+error;

});


}

</script>


</body>
</html>
